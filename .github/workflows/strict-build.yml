name: STM32H7S3L8 EMG Strict Build and Analysis

on:
  push:
    branches: [ main, master, develop, EMGsensor ]
  pull_request:
    branches: [ main, master, develop, EMGsensor ]

env:
  BUILD_TYPE: Release

jobs:
  build-test:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        toolchain: [gcc-arm, clang-host]
        cfg: [Debug, Release, Strict]
        include:
          - toolchain: gcc-arm
            cc: arm-none-eabi-gcc
            target: arm-none-eabi
          - toolchain: clang-host
            cc: clang
            target: x86_64-pc-linux-gnu
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Set up ARM toolchain
      if: matrix.toolchain == 'gcc-arm'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi
        
    - name: Set up Clang toolchain
      if: matrix.toolchain == 'clang-host'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang clang-tidy cppcheck
        
    - name: Set up common tools
      run: |
        sudo apt-get install -y build-essential git
        
    - name: Cache build artifacts
      uses: actions/cache@v3
      with:
        path: |
          obj
          bin
        key: ${{ runner.os }}-${{ matrix.toolchain }}-${{ matrix.cfg }}-${{ hashFiles('**/*.c', '**/*.h', 'Makefile') }}
        
    - name: Build with ARM GCC
      if: matrix.toolchain == 'gcc-arm'
      run: |
        case "${{ matrix.cfg }}" in
          Debug)
            make debug
            ;;
          Release)
            make release
            ;;
          Strict)
            make strict-build
            ;;
        esac
        
    - name: Build with Clang (Host)
      if: matrix.toolchain == 'clang-host'
      run: |
        case "${{ matrix.cfg }}" in
          Debug)
            TOOLCHAIN=clang-host make host-check
            ;;
          Release)
            TOOLCHAIN=clang-host make host-check
            ;;
          Strict)
            TOOLCHAIN=clang-host make host-sanitize
            ;;
        esac
        
    - name: Run static analysis
      if: matrix.toolchain == 'clang-host' && matrix.cfg == 'Strict'
      run: |
        make static-analysis
        make clang-tidy-analysis
        
    - name: Upload build artifacts
      if: matrix.toolchain == 'gcc-arm'
      uses: actions/upload-artifact@v3
      with:
        name: firmware-${{ matrix.cfg }}
        path: |
          bin/*.bin
          bin/*.elf
          bin/*.map
          
    - name: Upload analysis reports
      if: matrix.toolchain == 'clang-host' && matrix.cfg == 'Strict'
      uses: actions/upload-artifact@v3
      with:
        name: analysis-reports
        path: |
          analysis_reports/
          *.log
          *.txt
          
    - name: Memory usage analysis
      if: matrix.toolchain == 'gcc-arm'
      run: |
        make memory-analysis
        
    - name: Check for warnings
      if: matrix.toolchain == 'gcc-arm' && matrix.cfg == 'Strict'
      run: |
        # Ensure strict builds have zero warnings
        if make strict-build 2>&1 | grep -i warning; then
          echo "❌ Strict build contains warnings - failing build"
          exit 1
        else
          echo "✅ Strict build passed with zero warnings"
        fi

  comprehensive-validation:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Set up comprehensive toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-arm-none-eabi \
          clang clang-tidy cppcheck \
          binutils-arm-none-eabi \
          build-essential
          
    - name: Run comprehensive validation
      run: |
        make validate-all
        
    - name: Generate validation report
      run: |
        echo "# STM32H7S3L8 EMG Validation Report" > validation_report.md
        echo "## Build Information" >> validation_report.md
        echo "- **Commit**: ${{ github.sha }}" >> validation_report.md
        echo "- **Branch**: ${{ github.ref }}" >> validation_report.md
        echo "- **Date**: $(date)" >> validation_report.md
        echo "" >> validation_report.md
        echo "## Validation Results" >> validation_report.md
        echo "- ✅ Syntax and compilation check" >> validation_report.md
        echo "- ✅ Host-only static analysis" >> validation_report.md
        echo "- ✅ Strict build validation" >> validation_report.md
        echo "- ✅ Comprehensive static analysis" >> validation_report.md
        echo "" >> validation_report.md
        echo "## Memory Usage" >> validation_report.md
        make memory-analysis >> validation_report.md
        
    - name: Upload validation report
      uses: actions/upload-artifact@v3
      with:
        name: validation-report
        path: validation_report.md

  security-analysis:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Set up security analysis tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          clang clang-tidy cppcheck \
          build-essential
          
    - name: Run security analysis
      run: |
        make security-analysis
        make cert-compliance
        
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          security_report.txt
          cert_report.txt

  performance-benchmark:
    needs: build-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Set up ARM toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi
        
    - name: Build optimized firmware
      run: |
        make strict-release
        
    - name: Performance analysis
      run: |
        make performance
        make memory-analysis
        
    - name: Generate performance report
      run: |
        echo "# STM32H7S3L8 EMG Performance Report" > performance_report.md
        echo "## Build Configuration" >> performance_report.md
        echo "- **Optimization**: -O3 -flto" >> performance_report.md
        echo "- **Warnings**: Strict (zero warnings policy)" >> performance_report.md
        echo "" >> performance_report.md
        echo "## Performance Metrics" >> performance_report.md
        make performance >> performance_report.md
        echo "" >> performance_report.md
        echo "## Memory Usage" >> performance_report.md
        make memory-analysis >> performance_report.md
        
    - name: Upload performance report
      uses: actions/upload-artifact@v3
      with:
        name: performance-report
        path: performance_report.md